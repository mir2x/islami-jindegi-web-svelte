<!doctype html>
<html lang="%lang%" class="h-full antialiased">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			try {
				var t = localStorage.getItem('ij-theme');
				if (t === 'dark' || ((!t || t === 'system') && matchMedia('(prefers-color-scheme: dark)').matches))
					document.documentElement.classList.add('dark');
			} catch (e) {}
		</script>
		<meta name="theme-color" content="#0f766e" />
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="icon" href="/icon.png" sizes="192x192" type="image/png" />
		<link rel="apple-touch-icon" href="/apple-icon.png" sizes="180x180" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="preload" href="/fonts/SolaimanLipi.woff2" as="font" type="font/woff2" crossorigin />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="min-h-full flex flex-col [&_a]:no-underline">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
