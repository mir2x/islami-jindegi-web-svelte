name: build

# main    -> ghcr.io/<repo>:latest   (production build, indexable)
# staging -> ghcr.io/<repo>:staging  (test build: points at the test API, noindex)
on:
  push:
    branches: [main, staging]
  workflow_dispatch:

env:
  GOOGLE_CLIENT_ID: 218822188400-325p6t97csen9e944piah1h6ludvmoo6.apps.googleusercontent.com

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Pick environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "staging" ]; then
            echo "tag=staging" >> "$GITHUB_OUTPUT"
            echo "api=https://api-test.islamijindegi.com" >> "$GITHUB_OUTPUT"
            echo "site=https://test.islamijindegi.com" >> "$GITHUB_OUTPUT"
            echo "noindex=1" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "api=https://api.islamijindegi.com" >> "$GITHUB_OUTPUT"
            echo "site=https://islamijindegi.com" >> "$GITHUB_OUTPUT"
            echo "noindex=" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.env.outputs.tag }}
            type=sha,format=long,prefix=${{ steps.env.outputs.tag }}-

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.env.outputs.api }}
            NEXT_PUBLIC_SITE_URL=${{ steps.env.outputs.site }}
            NEXT_PUBLIC_NOINDEX=${{ steps.env.outputs.noindex }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ env.GOOGLE_CLIENT_ID }}
          cache-from: type=gha,scope=${{ steps.env.outputs.tag }}
          cache-to: type=gha,mode=max,scope=${{ steps.env.outputs.tag }}
