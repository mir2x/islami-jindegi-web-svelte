name: Deploy

# Build the image in CI, copy it to the VPS, restart the Quadlet unit there. Same flow as petsocial-web-svelte.
#
#   main    -> production: unit ij-web,             port 3000, indexable
#   staging -> test:       unit ij-web-svelte-test, port 3001, noindex, talks to the test API
#
# Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY (a dedicated deploy key, not your personal one).
on:
  push:
    branches: [main, staging]
  workflow_dispatch:

# One deploy per branch at a time; a newer push waits for the running one instead of cancelling it mid-restart.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: localhost/islami-jindegi-web-svelte
  # Public values (they end up in the browser bundle anyway).
  GOOGLE_CLIENT_ID: 218822188400-325p6t97csen9e944piah1h6ludvmoo6.apps.googleusercontent.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick environment
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "TAG=prod" >> "$GITHUB_ENV"
            echo "UNIT=ij-web.service" >> "$GITHUB_ENV"
            echo "CONTAINER=ij-web" >> "$GITHUB_ENV"
            echo "HOST_PORT=3000" >> "$GITHUB_ENV"
            echo "API_URL=https://api.islamijindegi.com" >> "$GITHUB_ENV"
            echo "SITE_URL=https://islamijindegi.com" >> "$GITHUB_ENV"
            echo "NOINDEX=" >> "$GITHUB_ENV"
          else
            echo "TAG=staging" >> "$GITHUB_ENV"
            echo "UNIT=ij-web-svelte-test.service" >> "$GITHUB_ENV"
            echo "CONTAINER=ij-web-svelte-test" >> "$GITHUB_ENV"
            echo "HOST_PORT=3001" >> "$GITHUB_ENV"
            echo "API_URL=https://api-test.islamijindegi.com" >> "$GITHUB_ENV"
            echo "SITE_URL=https://test.islamijindegi.com" >> "$GITHUB_ENV"
            echo "NOINDEX=1" >> "$GITHUB_ENV"
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # The site reads these when it starts, so the build args only set defaults; the unit's environment wins.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ env.SITE_URL }}
            NEXT_PUBLIC_NOINDEX=${{ env.NOINDEX }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ env.GOOGLE_CLIENT_ID }}
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}

      - name: Save image
        run: docker save ${{ env.IMAGE }}:${{ env.TAG }} | gzip > image-${{ env.TAG }}.tar.gz

      - name: Copy image to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: image-${{ env.TAG }}.tar.gz
          target: /tmp/

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            export XDG_RUNTIME_DIR=/run/user/$(id -u)
            IMG=${{ env.IMAGE }}:${{ env.TAG }}
            PREV=${{ env.IMAGE }}:${{ env.TAG }}-previous

            # Keep the running image so a failed start can roll back to it.
            if podman image exists "$IMG"; then
              podman tag "$IMG" "$PREV"
            fi

            gunzip -c /tmp/image-${{ env.TAG }}.tar.gz | podman load
            rm -f /tmp/image-${{ env.TAG }}.tar.gz

            systemctl --user restart ${{ env.UNIT }}

            echo "Waiting for ${{ env.CONTAINER }}..."
            for i in $(seq 1 12); do
              sleep 5
              # robots.txt needs no API call, so an API outage cannot block (or roll back) a web deploy.
              if curl --fail --silent http://127.0.0.1:${{ env.HOST_PORT }}/robots.txt > /dev/null; then
                echo "Deployed ${{ env.CONTAINER }}."
                podman image prune -f > /dev/null
                exit 0
              fi
              echo "Attempt $i failed, retrying..."
            done

            echo "Health check failed after 60 seconds"
            podman logs --tail 40 ${{ env.CONTAINER }} || true
            if podman image exists "$PREV"; then
              echo "Rolling back to the previous image"
              podman tag "$PREV" "$IMG"
              systemctl --user restart ${{ env.UNIT }}
            fi
            exit 1
